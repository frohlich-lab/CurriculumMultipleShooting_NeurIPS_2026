name: Build and publish Docker image for NEMO

on:
  push:
    branches:
      - Development_Docker   # Only run on pushes to Development_Docker branch
    paths:
      - 'requirements.txt'   # Monitor changes to requirements.txt
      - 'docker/Dockerfile'   # Monitor changes to docker/Dockerfile

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
    
    - name: Check out the repo
      uses: actions/checkout@v3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      
    # Build the Docker image
    - name: Build Docker image
      run: |
        docker build -t giacomofabrini/test_ude:amd64 --platform linux/amd64 -f docker/Dockerfile .

    # Push the Docker image to Docker Hub
    - name: Push Docker image
      run: |
        docker push giacomofabrini/test_ude:amd64
